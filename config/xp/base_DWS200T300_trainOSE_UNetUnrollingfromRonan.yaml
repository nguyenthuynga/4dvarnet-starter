# ##model of UNet Unrolling from Ronan
model:
  _target_:  src.models_UNet_unrolling.Lit4dVarNetIgnoreNaN #_FM_E2E# src.models_UNet_unrolling instead of contrib.4dvarnet_latent_Unet_Unrolling.models
  w_mse: 50.
  w_grad_mse: 1000.
  w_prior: 1. #1.
  w_mse_lr: 0.
  w_grad_mse_lr: 0
  osse_with_interp_error: false #true
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam
    _partial_: true
    lr: 1e-4 # Updated from 1e-3 to 0.0003 (1e-4 * 3)
    T_max: ${trainer.max_epochs}
  rec_weight:
      _target_: src.utils.get_triang_time_wei
      patch_dims: ${datamodule.xrds_kw.patch_dims}
      crop: {time: 0, lat: 0, lon: 0}
      offset: 1
  val_rec_weight:
      _target_: src.utils.get_triang_time_wei
      patch_dims: ${datamodule.xrds_kw.patch_dims}
      crop: {time: 0, lat: 0, lon: 0}
      offset: 1
  #use_fm_learning: true
  solver:
    _target_: src.models_UNet_unrolling.GradSolver_withStep #GradSolver_FM #GradSolver_withStep # # # # # ##GradSolver_FM # #ocean4dvarnet.models.GradSolver
    n_step: 5 #2 #5 #10
    lr_grad: 0 #1e3
    std_init: 0.1
    input_grad_update: 'subgrad+state' #'obs+state' ##'grad-only' #'grad+state' #'obs-only'  # 'grad+previous'  #'gobs+sgprior' #'grad+state'  #'grad-only' #'grad+state'  #'grad+state' #    
    # lr_grad: 0.2
    prior_cost:
      _target_: src.models_UNet_unrolling.GenericAEPriorCost
      model_ae:
        _target_: src.unet_UNet_unrolling.UNetModel #src.unet_UNet_unrolling instead of contrib.4dvarnet_latent_Unet_Unrolling.unet
        dims: 2
        in_channels: ${datamodule.xrds_kw.patch_dims.time} #{datamodule.xrds_kw.train.patch_dims.time}
        out_channels: ${datamodule.xrds_kw.patch_dims.time} #{datamodule.xrds_kw.train.patch_dims.time}
        model_channels: 32 #32
        num_res_blocks: 2
        channel_mult: [1,2,4]
        attention_resolutions: []
        use_checkpoint: true
        dropout: 0.1
        bias: false #true #
        #interp_mode: 'bilinear' #'nearest' # 
      #_target_: contrib.4dvarnet_latent_Unet_Unrolling.models.AEPriorCostOneScale #AEPriorCostTwoScale #BilinAEPriorCostTwoScale # 
      #dim_in: 15 #15 #${datamodule.xrds_kw.patch_dims.time}+${model.solver.latent_decoder.dim_latent} ##{datamodule.xrds_kw.train.patch_dims.time}
      #dim_hidden: 128 #128 #64
      #bilin_quad: false
      # bilin_quad: true
      #downsamp: 4 #4 #null # 4
      #bias: false
    obs_cost:
      _target_: src.models.BaseObsCost # ocean4dvarnet.models.BaseObsCost
    grad_mod:
      _target_: src.models_UNet_unrolling.GradModelWithCondition
      #use_grad_norm: true
      grad_model: 
        _target_: src.unet_UNet_unrolling.UNetModel2
        dims: 2
        in_channels: 30 #${datamodule.xrds_kw.patch_dims.time}*3                  #{datamodule.xrds_kw.train.patch_dims.time}
        out_channels: ${datamodule.xrds_kw.patch_dims.time} #{datamodule.xrds_kw.train.patch_dims.time}
        model_channels: 64 #32
        num_res_blocks: 2
        channel_mult: [1,2,4]
        attention_resolutions: []
        use_checkpoint: true
        dropout: 0.1
        bias: false #true #
        interp_mode: 'bilinear' #'nearest' # 
      # grad_model: 
      #  _target_: contrib.4dvarnet_latent_Unet_Unrolling.unet_3d_film.UNet3D_Transformer
      #  in_channels: 3
      #  channels: [64,64,128,128]        # depth over width
      #  embed_dim: 256
      #  dropout: 0.1                       # set to 0.05–0.20 per your dataset size
      #  attn_heads: 1
      #  text_dim: 1                         # kept for signature compatibility
      #  nAttr: 40 


entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
  # - _target_: src.test.base_test
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
